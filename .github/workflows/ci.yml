name: RPG Quality Check

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q game rpg_ai rpg_core rpg_world story

      - name: Run tests
        run: python -m pytest -q

      - name: Validate JSON story/data files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ignored = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}
          roots = [Path('story'), Path('rpg_world'), Path('game/assets')]
          files = [p for root in roots if root.exists() for p in root.rglob('*.json')]
          checked = 0
          for path in files:
              if any(part in ignored for part in path.parts):
                  continue
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              checked += 1
          print(f'Validated {checked} JSON story/data file(s).')
          PY

      - name: Smoke test launcher imports
        run: python -c "import game.__main__; import game.launcher; import story.engine; print('Launcher/story imports OK')"
