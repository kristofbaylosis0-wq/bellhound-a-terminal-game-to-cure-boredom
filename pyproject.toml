[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-rpg-chatgpt"
version = "0.1.0"
description = "An open-source AI-assisted terminal text RPG."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
text-rpg = "game.__main__:main"

[tool.setuptools.packages.find]
include = ["game*", "rpg_ai*", "rpg_core*", "rpg_world*"]
